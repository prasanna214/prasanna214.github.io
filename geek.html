<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wedding Reception | Mizar & Alcor</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />
  <script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links/lib/xterm-addon-web-links.js"></script>

  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
      font-family: monospace;
    }

    #matrix {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
    }

    #terminal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-width: 900px;
      height: 80%;
      max-height: 80vh;
      z-index: 1;
      background: rgba(0, 0, 0, 0.75);
      padding: 10px;
      padding-bottom: 25px;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(0, 255, 65, 0.2);
      overflow: hidden;
      box-sizing: border-box;
    }

    /* Geek Mode Scrollbar styling (Globally Hidden) */
    ::-webkit-scrollbar {
      display: none;
      width: 0px;
      height: 0px;
    }

    * {
      scrollbar-width: none;
      /* Firefox */
      -ms-overflow-style: none;
      /* IE/Edge */
    }

    /* Padding for xterm container */
    .xterm {
      height: 100%;
      box-sizing: border-box;
      padding-bottom: 10px;
      /* Add bottom padding to terminal text viewport */
    }

    .toggle-container {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: monospace;
      color: #00ff41;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 12px;
      border-radius: 30px;
      border: 1px solid rgba(0, 255, 65, 0.3);
      backdrop-filter: blur(4px);
    }

    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 24px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 255, 65, 0.2);
      transition: .4s;
      border-radius: 24px;
      border: 1px solid #00ff41;
      animation: glow-terminal 2s ease-in-out infinite;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: #00ff41;
      transition: .4s;
      border-radius: 50%;
      box-shadow: 0 0 5px #00ff41;
    }

    .slider {
      background-color: rgba(0, 255, 65, 0.4);
      box-shadow: 0 0 15px rgba(0, 255, 65, 0.6);
      /* Slightly stronger track glow when fully active */
    }

    .slider:before {
      transform: translateX(22px);
    }

    .toggle-switch input:focus+.slider {
      box-shadow: 0 0 16px #00ff41;
    }

    @keyframes glow-terminal {

      0%,
      100% {
        box-shadow: 0 0 5px rgba(0, 255, 65, 0.2);
      }

      50% {
        box-shadow: 0 0 15px rgba(0, 255, 65, 0.6);
      }
    }

    @media (max-width: 600px) {
      #terminal {
        width: 95%;
        height: 90%;
        max-height: 90vh;
        padding: 5px;
        padding-bottom: 25px;
      }
    }
  </style>
</head>

<body>
  <canvas id="matrix"></canvas>
  <div id="terminal"></div>
  <div class="toggle-container">
    <span>Geek Mode</span>
    <label class="toggle-switch">
      <!-- Checked by default because we are IN Geek mode on geek.html -->
      <input type="checkbox" checked onchange="window.location.href='index.html'">
      <span class="slider"></span>
    </label>
  </div>

  <script>
    /* ================= MATRIX BACKGROUND ================= */

    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");

    const letters = "01";
    const fontSize = 14;

    let columns = 0;
    let drops = [];

    function resizeCanvas() {
      canvas.height = window.innerHeight;
      canvas.width = window.innerWidth;

      columns = Math.floor(canvas.width / fontSize);
      drops = Array(columns).fill(1);
    }

    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    function drawMatrix() {
      // Fade effect to create trailing letters
      ctx.fillStyle = "rgba(0,0,0,0.08)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Matrix text color (medium bright)
      ctx.fillStyle = "rgba(0, 255, 65, 0.6)";
      ctx.font = fontSize + "px monospace";

      for (let i = 0; i < drops.length; i++) {
        const text = letters.charAt(Math.floor(Math.random() * letters.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }

        drops[i]++;
      }
    }

    setInterval(drawMatrix, 35);

    /* ================= TERMINAL ================= */

    const term = new Terminal({
      cursorBlink: true,
      fontSize: window.innerWidth < 600 ? 14 : 16,
      fontFamily: 'monospace',
      theme: {
        background: "transparent",
        foreground: "#00ff41"
      }
    });

    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);

    // Add WebLinksAddon to make URLs clickable
    const webLinksAddon = new WebLinksAddon.WebLinksAddon();
    term.loadAddon(webLinksAddon);

    term.open(document.getElementById("terminal"));

    // Ensure the terminal fits the container size
    fitAddon.fit();
    window.addEventListener("resize", () => {
      term.options.fontSize = window.innerWidth < 600 ? 14 : 16;
      fitAddon.fit();
    });

    /* ================= BOOT LOG ================= */

    const bootLogs = [
      "[    0.000000 ] Linux version 6.1.0-wedding (gcc 13.2.0)",
      "[    0.000001 ] Command line: init=/sbin/systemd",
      "[    0.001313 ] ACPI: Power coupling stable. Dynamic load balance between nodes: perfectly synced.",
      "[    0.003313 ] systemd[1]: systemd 313 running in celebration mode.",
      "",
      "[    0.133313 ] systemd[1]: Starting compatibility-check.service...",
      "[    0.303313 ] compatibility-check[42]: Status: Beyond optimal. Synergy level: 100%.",
      "",
      "[    0.333313 ] compatibility-check[42]: \u001b[31m\u001b[5mWARNING:\u001b[0m Single status deprecated and marked for deletion ♥",
      "",
      "[    0.553313 ] systemd[1]: Starting engagement.service...",
      "[    0.883313 ] engagement.service: active (committed)",
      "",
      "[    1.030000 ] systemd[1]: Starting reception.service...",
      "[    1.030313 ] reception.service: Guests invited to Reception Ceremony.",
      "[    1.303313 ] systemd[1]: Startup finished successfully.",
      ""
    ];

    let currentLine = 0;

    function typeBoot() {
      if (currentLine < bootLogs.length) {
        term.writeln(bootLogs[currentLine]);
        currentLine++;
        setTimeout(typeBoot, 350);
      } else {
        startTerminal();
      }
    }

    setTimeout(typeBoot, 800);

    /* ================= COMMAND SYSTEM ================= */

    let input = "";
    let history = [];
    let historyIndex = -1;
    let currentDir = "/";
    let inputEnabled = true;

    const fileContents = {
      "invite.txt": "You are invited to the Wedding Reception of\n\nPrasanna ❤️ Jaswanth\n\nWe would be honored by your presence.",
      "venue.txt": "Venue: SS Function Hall\nAddress: Ubalanka\nMap Link: https://maps.app.goo.gl/7WDtS5qKhP9vLoWbA",
      "schedule.txt": "Date: Sunday, 15th March\nTime: 11:00 AM",
      "dresscode.txt": "Dress Code: Traditional / Formal",
      "rsvp.txt": "Kindly confirm your presence at the following link:\nhttps://docs.google.com/forms/d/e/1FAIpQLSe7vhfodFpy264ff0j1lU_ma7Anygdblk1I6apoLtxE6Icw9w/viewform\n\nWe look forward to celebrating with you!"
    };

    function prompt() {
      if (!inputEnabled) return;
      const dirDisp = currentDir === "/" ? "~" : "~" + currentDir;
      term.write(`\r\nguest@login:${dirDisp}$ `);
    }

    function showHelp() {
      term.writeln("Available commands:");
      term.writeln("help        - Show available commands");
      term.writeln("ls          - List files");
      term.writeln("cat         - Read file");
      term.writeln("clear       - Clear screen");
    }

    function clearLine() {
      while (input.length > 0) {
        term.write("\b \b");
        input = input.slice(0, -1);
      }
    }

    function startTerminal() {
      const now = new Date();
      const timeString = now.toDateString() + " " + now.toTimeString().split(" ")[0];
      term.writeln(`Last login: ${timeString} on console`);
      term.writeln("Welcome to Mizar & Alcor OS (guest user)");
      term.writeln("");

      showHelp();
      prompt();

      term.attachCustomKeyEventHandler(ev => {
        if (!inputEnabled) return false;

        // Prevent default tab behavior (losing focus)
        if (ev.key === "Tab") {
          if (ev.type === 'keydown') {
            ev.preventDefault(); // Explicitly prevent default browser action
            handleAutocomplete();
          }
          return false; // Tell xterm to not process it further
        }

        if (ev.ctrlKey && ev.key === "c") {
          term.write("^C");
          input = "";
          prompt();
          return false;
        }

        // Ctrl+L or Cmd+K (mac) to clear terminal
        if ((ev.ctrlKey && ev.key === "l") || (ev.metaKey && ev.key === "k")) {
          // Only trigger on keydown to prevent double-firing
          if (ev.type === 'keydown') {
            term.clear();
            // Move cursor to top left, clear screen entirely, then reprint prompt
            term.write('\x1bc'); // Full terminal reset sequence
            prompt();
            term.write(input);
          }
          return false;
        }

        return true;
      });

      function handleAutocomplete() {
        const commands = ["help", "ls", "cat", "clear"];
        const words = input.split(" ");
        const isCommand = words.length === 1;
        const word = words[words.length - 1];

        let matches = [];
        let prefix = word;

        if (isCommand) {
          matches = commands.filter(c => c.startsWith(word));
        } else {
          let searchDir = currentDir;
          if (word.includes("/")) {
            const lastSlash = word.lastIndexOf("/");
            let dirPart = word.substring(0, lastSlash);
            prefix = word.substring(lastSlash + 1);

            if (dirPart === "" || dirPart === "~") {
              searchDir = "/";
            } else {
              searchDir = currentDir === "/" ? "/" + dirPart : currentDir + "/" + dirPart;
            }
            searchDir = searchDir.replace(/\/\//g, "/").replace(/\/$/, "");
            if (searchDir === "") searchDir = "/";
          }

          let options = [];
          if (searchDir === "/") {
            options = ["invite.txt", "venue.txt", "schedule.txt", "dresscode.txt", "rsvp.txt"];
          }

          matches = options.filter(o => o.startsWith(prefix));
        }

        if (matches.length > 0) {
          if (matches.length === 1) {
            const completion = matches[0].substring(prefix.length);
            input += completion;
            term.write(completion);
            if (!matches[0].endsWith("/")) {
              input += " ";
              term.write(" ");
            }
          } else {
            let common = matches[0];
            for (let i = 1; i < matches.length; i++) {
              while (!matches[i].startsWith(common)) {
                common = common.substring(0, common.length - 1);
              }
            }
            if (common.length > prefix.length) {
              const completion = common.substring(prefix.length);
              input += completion;
              term.write(completion);
            } else {
              term.write("\r\n" + matches.join("  "));
              prompt();
              term.write(input);
            }
          }
        }
      }

      term.onData(e => {
        if (!inputEnabled) return;

        if (e === "\r") {
          term.write("\r\n");
          runCommand(input.trim());

          if (input.trim().length > 0) {
            history.push(input);
          }

          historyIndex = history.length;
          input = "";
          prompt();
          return;
        }

        if (e === "\u007F") {
          if (input.length > 0) {
            input = input.slice(0, -1);
            term.write("\b \b");
          }
          return;
        }

        if (e === "\x1b[A") {
          if (historyIndex > 0) {
            historyIndex--;
            clearLine();
            input = history[historyIndex] || "";
            term.write(input);
          }
          return;
        }

        if (e === "\x1b[B") {
          if (historyIndex < history.length - 1) {
            historyIndex++;
            clearLine();
            input = history[historyIndex] || "";
            term.write(input);
          } else {
            historyIndex = history.length;
            clearLine();
            input = "";
          }
          return;
        }

        if (e.startsWith("\x1b")) return;

        input += e;
        term.write(e);
      });
    }

    function runCommand(cmd) {
      if (!cmd) return;
      const args = cmd.split(" ").filter(Boolean);
      const command = args[0].toLowerCase();

      switch (command) {
        case "help":
          showHelp();
          break;

        case "ls":
          let lsTarget = args[1];
          let lsPath = currentDir;
          if (lsTarget) {
            if (lsTarget === "/" || lsTarget === "~") {
              lsPath = "/";
            } else {
              lsPath = currentDir === "/" ? "/" + lsTarget : currentDir + "/" + lsTarget;
            }
            lsPath = lsPath.replace(/\/\//g, "/").replace(/\/$/, "");
          }

          if (lsPath === "" || lsPath === "/") {
            term.writeln("invite.txt  venue.txt  schedule.txt  dresscode.txt  rsvp.txt");
          } else {
            term.writeln(`ls: cannot access '${lsTarget}': No such file or directory`);
          }
          break;

        case "cat":
          let file = args[1];
          if (!file) {
            term.writeln("cat: missing operand");
            break;
          }

          let fileName = file;
          // Strip leading slash if they try an absolute path like /invite.txt
          if (fileName.startsWith("/")) {
            fileName = fileName.substring(1);
          }

          if (fileContents[fileName]) {
            const lines = fileContents[fileName].split("\n");
            for (let line of lines) {
              term.writeln(line);
            }
          } else {
            term.writeln(`cat: ${file}: No such file or directory`);
          }
          break;

        case "clear":
          term.clear();
          term.write('\x1bc'); // Full terminal reset sequence
          break;

        default:
          term.writeln("Command not found. Type 'help'");
      }
    }

    // Audio persistence and navigation overriding
    function setupSmoothNavigation() {
      const toggleCheckbox = document.querySelector('.toggle-switch input');
      if (toggleCheckbox) {
        toggleCheckbox.removeAttribute('onchange');
        toggleCheckbox.addEventListener('change', function (e) {
          e.preventDefault();
          const targetPage = 'index.html';
          const audio = document.getElementById('bg-music');
          if (audio) {
            sessionStorage.setItem('audioTime', audio.currentTime);
            sessionStorage.setItem('audioPlaying', !audio.paused);
          }
          window.location.href = targetPage;
        });
      }
    }

    function initAudio() {
      let audio = document.getElementById('bg-music');

      if (!audio) {
        audio = document.createElement('audio');
        audio.id = 'bg-music';
        audio.src = 'audio.mp3';
        audio.loop = true;
        document.body.appendChild(audio);
      }

      const savedTime = sessionStorage.getItem('audioTime');
      const wasPlaying = sessionStorage.getItem('audioPlaying');

      if (savedTime) {
        audio.currentTime = parseFloat(savedTime);
      }

      const startAudio = function () {
        audio.play().then(() => {
          sessionStorage.setItem('audioPlaying', 'true');
        }).catch((err) => console.log("Audio play failed:", err));
        document.removeEventListener('click', startAudio);
      };

      if (wasPlaying === 'true') {
        audio.play().then(() => {
          sessionStorage.setItem('audioPlaying', 'true');
        }).catch(() => {
          document.addEventListener('click', startAudio);
        });
      } else {
        document.addEventListener('click', startAudio);
      }

      setInterval(() => {
        if (!audio.paused) {
          sessionStorage.setItem('audioTime', audio.currentTime);
        }
      }, 1000);
    }

    document.addEventListener('DOMContentLoaded', () => {
      setupSmoothNavigation();
      initAudio();
    });
  </script>
</body>

</html>
