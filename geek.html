<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- SEO & Performance Meta Tags -->
    <meta
      name="description"
      content="Geek Mode: You are invited to the Wedding Reception of Jaswanth and Prasanna."
    />
    <meta name="theme-color" content="#000000" />
    <meta property="og:title" content="Geek Terminal | Wedding Reception" />
    <meta property="og:description" content="Access the reception mainframe." />
    <meta property="og:type" content="website" />

    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <title>Wedding Reception | Jaswanth & Prasanna</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/heart.png" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"
    ></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"
    ></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links/lib/xterm-addon-web-links.js"
    ></script>

    <link rel="stylesheet" href="css/geek.css" />

    <script src="js/audio.js" defer></script>
    <script src="js/matrix.js" defer></script>
    <script src="js/geek.js" defer></script>
  </head>

  <body>
    <canvas id="matrix"></canvas>
    <div id="terminal"></div>
    <div class="toggle-container">
      <span>Geek Mode</span>
      <label class="toggle-switch">
        <!-- Checked by default because we are IN Geek mode on geek.html -->
        <input
          type="checkbox"
          checked
          onchange="window.location.href = 'index.html'"
        />
        <span class="slider"></span>
      </label>
    </div>
  </body>
</html>
